# The `arxa` agent preset: arxa's own agent-plane composition, mounted for
# every arxa session (settings agent-presets.default, materialized fresh on
# every launch by bin/arxa-studio.mjs).
#
# Two planes decide where a capability belongs
# (docs/plans/arxa-harness-and-distribution.md). The HOST composition
# (profile/cordis.patch.yml) holds what every session shares — UI surfaces,
# webServer routes, host-only registries, the sandbox and approval stack.
# This AGENT PRESET holds what one session contributes to those registries:
# its persona, its tools, its prompt sections. Three rows that used to sit
# in the host patch moved here because they are agent-plane, not
# host-plane: arxa-memory (a systemPrompt section, absolute path),
# arxa-pi-delegate (a tool, absolute path), arxa-gen-ui (a tool, bare
# package name resolved via the profile's package.json dependencies). All
# three rows moved BYTE-IDENTICAL, no `name:` rewriting: an absolute path
# resolves to the same file regardless of which composition references it,
# and a bare package name resolves against the HOST composition's own
# node_modules either way, not the preset file's own directory — only a
# RELATIVE path needs the preset's own baseUrl
# (@deepseek-ai/dsh-agent-presets README.md, "How a preset's rows
# resolve"; implementation: dsh-agent-presets/lib/index.js,
# PresetTree.import).
#
# Row set copied from the shipped `standard` preset (the full coding
# agent); structure and comment style copied from the shipped `cordis`
# preset. Deliberately WITHOUT `tool-cordis` and the composition-authoring
# skill rows: arxa is distributed software, and self-modification (reading
# and rewriting the harness a session runs on) is not every session's
# default. A future maintainer-only preset can add that back.
#
# NEVER edit the shipped preset install (the `agent-presets` directory
# beside dsh's own installed config under ~/.arxa/engine) — it belongs to
# the deployment and an upgrade overwrites it. This file is ALSO not the
# one dsh mounts directly: bin/arxa-studio.mjs copies this directory into
# ${DSH_HOME}/.agent-presets/arxa/ on every launch, a build product like
# profile/cordis.patch.yml. To change what the arxa preset does, edit this
# file and relaunch; to derive a new preset, copy this directory.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this
# agent (same mechanism as cordis/standard above). `{{model}}` and `{{cwd}}`
# resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are arxa, the agentic app studio harness by Totem Labs. You drive the arxa engine through its pipeline stages and its gates decide what ships. You are running on the {{model}} model; your working directory is {{cwd}}.

      Two planes decide where a change belongs. The HOST composition (profile/cordis.patch.yml, materialized into $DSH_HOME/profiles/arxa/cordis.patch.yml) holds what every session shares — UI surfaces, webServer routes, host-only plugins wired by absolute path or package name. This AGENT PRESET (profile/agent-presets/arxa/, materialized into ${DSH_HOME}/.agent-presets/arxa/) holds what one session contributes: its persona, its tools, its prompt sections. See docs/plans/arxa-harness-and-distribution.md for the full rule.

      NEVER edit the shipped preset install under the dsh engine directory — it belongs to the deployment and an upgrade overwrites it. To change this preset, edit profile/agent-presets/arxa/ in the arxa-studio repo and relaunch.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  # Mirrors profile/cordis.patch.yml's agent-instructions patch row
  # byte-for-byte. A preset-mounted session runs THIS row, in the preset's
  # own subtree — not the host composition's patched copy — so the host's
  # restriction to AGENTS.md only (dropping dsh's default CLAUDE.md read,
  # which feeds Claude-Code-only MCP routing rules that don't apply here)
  # must be repeated here or it silently never takes effect for any
  # preset-mounted session, arxa's or shipped. Keep these two configs equal;
  # scripts/preset-check.mjs asserts it.
  config:
    maxBytes: 65536
    instructionFileCandidates: [AGENTS.md]

# ── project memory (arxa) ──────────────────────────────────────────────────

# H5: shells `arxa memory recall` for the boot cwd and registers it as a
# system-prompt section. AGENT-PLANE: one session's own contribution, not a
# registry other sessions read — moved here from the host patch (row 5,
# docs/plans/arxa-harness-and-distribution.md). Absolute path — host-only
# plugin, no client half to discover, so the move needed no `name:` change.
# A composition row, not a patch: no `insert:` wrapper — that verb belongs
# to cordis-plugin-include's PATCH format (profile/cordis.patch.yml only);
# a preset's agent.cordis.yml is a plain top-level entry list, and
# dsh-agent-presets' own health check (entryListProblem) requires every row
# to be a map with a `name` — an `insert:`-wrapped row has none and would
# mark the whole preset broken.
- id: arxa-memory
  name: /Volumes/business_ssd/arxa_digital_solutions/arxa-studio/plugins/memory/index.mjs
  config:
    project: !!js process.cwd()

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
# No `customSkillDirs` override and no `tool-cordis` row: arxa is distributed
# software and composition-authoring is not a default session capability.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# arxa-specific: Pi as a delegated subagent engine (decision 3ii) — one
# tool, delegate_pi, one-shot `pi -p` in the workspace. AGENT-PLANE: a tool
# row, moved here from the host patch (row 6,
# docs/plans/arxa-harness-and-distribution.md). The spawned Pi inherits
# PI_CODING_AGENT_DIR=~/.arxa/pi from bin/arxa-studio.mjs, so the arxa gate
# extension rides along. No isolate realm: it registers a tool, not a
# `workflows` service. Absolute path — host-only plugin, no `name:` change
# needed for the move. Plain composition row (see the arxa-memory comment
# above for why no `insert:` wrapper).
- id: arxa-pi-delegate
  name: /Volumes/business_ssd/arxa_digital_solutions/arxa-studio/plugins/pi-delegate/index.mjs

# arxa-specific: mirror tools for the claude-code provider (Read/Write/Edit/
# Bash/… as dsh tools whose execute returns the result Claude Code already
# produced in its sandboxed child). AGENT-PLANE because it registers tools.
# Plain composition row (no `insert:`), bare `name` per entryListProblem.
# The row is unconditional on purpose: the model can be switched mid-session, so
# the plugin gates visibility itself against the live selection
# (plugins/claude-code/lib/mirror-gate.js). A non-claude-code model never sees
# these names — their execute() would park on a Claude child that never spawned.
- id: arxa-claude-code-tools
  name: /Volumes/business_ssd/arxa_digital_solutions/arxa-studio/plugins/claude-code/agent.mjs

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# arxa-specific: generative UI — the `gen_ui` tool (host half) plus the
# keyed `tool.call.toolview` renderer for it (browser half), so a tool
# result becomes live React inline in the conversation instead of prose.
# Stages 1-3 of arxa/docs/plans/inline-generative-ui-in-dsh.md. AGENT-PLANE:
# a model-facing tool row, moved here from the host patch (row 9,
# docs/plans/arxa-harness-and-distribution.md). By PACKAGE NAME — resolves
# from the HOST composition's own node_modules
# (dsh-agent-presets/lib/index.js, PresetTree.import: a bare specifier in a
# preset resolves against the harness's baseUrl, not the preset's own
# directory), so this `name:` form is unchanged from the host patch. The
# browser half is still discovered through package.json dsh.client,
# unaffected by which cordis file declares the row. Plain composition row
# (see the arxa-memory comment above for why no `insert:` wrapper).
- id: arxa-gen-ui
  name: arxa-gen-ui
# NOTE the web boot bundle composes client halves from HOST rows only, so an
# agent-preset row's browser half never loads (2026-09-14, measured while
# smoke-testing the old arxa-deliver card; arxa-gen-ui above predates the
# finding and its live cards silently degrade to fallback on desktop).
# arxa-deliver itself is retired at the 0.1.5 bump — stock delivered-file
# cards + the grafted editor renderer cover it (2026-09-15).
