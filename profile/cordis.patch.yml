# The arxa profile patch — materialized by bin/arxa-studio.mjs into
# $DSH_HOME/profiles/arxa/cordis.patch.yml, applied after the bundle layers.
#
# Each patch earns its row (arxa-harness-and-distribution.md):
#
# 1. Identity. dsh-base's `system-prompt` entry ships
#    "You are an AI agent powered by DeepSeek Harness." behind
#    `includeHarnessIdentity` (default true) with an empty persona slot —
#    so arxa's identity is a CONFIG override, one rung above the plan's
#    "register a replacement plugin" (the plugin swap stays available if a
#    future dsh drops the flag). NOTE: a non-insert patch REPLACES the whole
#    `config` object (applyEntryPatches: target[key] = value), so this block
#    must stay complete, not minimal.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: >-
      You are arxa, the agentic app studio harness by Totem Labs. You drive
      the arxa engine through its pipeline stages and its gates decide what
      ships.

# 2. Repo law only. dsh reads BOTH AGENTS.md and CLAUDE.md by default
#    (dsh-agent-instructions instructionFileCandidates), which feeds it
#    Claude-Code-only MCP routing rules. Config fix, not file layout
#    (H1 amendment 3). maxBytes restated because config replaces wholesale.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: [AGENTS.md]

# 3. Silence the DeepSeek-worded web-surface identity. dsh-web-app's
#    web-runtime row injects "DeepSeek Harness Web GUI" into the system
#    prompt (plus a harness-source section and the DSH_WEB_URL shell
#    variable) behind surfaceContext. arxa-brand (row below) re-registers
#    the orientation arxa-worded; the other two are deliberately dropped.
#    Config replaces wholesale, so printUrl/trustedHosts are restated —
#    and so is openBrowser: dropping it silently falls back to the schema
#    default (true), which made every server boot open a browser tab that
#    presence then denied and closed. Restating the webStartup wiring keeps
#    `--no-open` (launchd wrapper + desktop sidecar spawn) honored while
#    standalone `arxa-studio` browser mode still auto-opens.
#    Headless profiles have no web-runtime row — the loader warns and skips.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# 4. The arxa gate on every mutating tool call (harness/README.md template;
#    absolute path because arxa declares no npm dependency on the plugin).
- insert:
  - id: arxa-gate
    name: /Volumes/business_ssd/arxa_digital_solutions/arxa/harness/dsh-external-gate/index.mjs
    config:
      command: /Volumes/business_ssd/arxa_digital_solutions/arxa/harness/verdict.sh
      # dsh-native tool names (dsh-tool-fs registers write/edit, not Write/Edit).
      # The 2026-08-21 booted check proved Claude-cased names match nothing here.
      tools: [write, edit, str_replace_editor, bash]
      timeoutMs: 5000

# 5. Project memory injection (H5) — AGENT-PLANE, moved to the arxa preset
#    (profile/agent-presets/arxa/agent.cordis.yml, row arxa-memory). A
#    systemPrompt section is one session's own contribution, not a host
#    registry; see docs/plans/arxa-harness-and-distribution.md.

# 6. Pi delegation (decision 3ii) — AGENT-PLANE, moved to the arxa preset
#    (profile/agent-presets/arxa/agent.cordis.yml, row arxa-pi-delegate). A
#    tool row belongs with the other delegation tools on the plane that
#    contributes tools, not the plane that owns registries; see
#    docs/plans/arxa-harness-and-distribution.md.

# 6b. The arxa sandbox provider (S1, docs/plans/arxa-isolation-levels.md §17-18).
#     dsh-base's `sandbox` row mounts @deepseek-ai/dsh-sandbox-local, whose
#     `workspace-write` mode grants exactly workspaceRoot + /tmp + os.tmpdir()
#     (dsh-sandbox/lib/index.js:154-161, no extension point). §17 measured that
#     `dart` and `flutter` FAIL under it: the toolchain writes to its own SDK
#     cache and to ~/.dart-tool on every invocation. arxa-sandbox SUBCLASSES the
#     stock provider and appends the runtime-resolved toolchain roots at the
#     `runnerArgv` seam — same confinement, same fail-closed posture, same
#     `.git` semantics, three more writable roots (none hardcoded; a machine
#     without Flutter gets stock dsh behaviour byte for byte).
#
#     Same revert shape as rows 11a/11c/16: delete this row pair and the stock
#     dsh provider is back, package untouched. Verified by
#     plugins/sandbox/selftest.mjs (logic) and scripts/s1-sandbox-verify.mjs
#     (the real Seatbelt kernel: dart/flutter/git/node/npm pass confined, a
#     sibling-directory write is denied).
#
#     ORDER: `insert` appends to the end of the entry list, so this row is
#     registered AFTER sandbox-policy/bash-sandbox, which inject `sandbox`.
#     That is fine — cordis service injection is reactive, not declaration
#     ordered (arxa-frame/arxa-locale replace ctx.layout/ctx.locale the same way).
#
#     Absolute path — host-only plugin, no client half to discover, and arxa
#     declares no npm dependency on it (same shape as row 14; rows 5 and 6
#     were this shape too, before they moved to the arxa preset).
- id: sandbox
  disabled: true
- insert:
  - id: arxa-sandbox
    name: /Volumes/business_ssd/arxa_digital_solutions/arxa-studio/plugins/sandbox/lib/index.js

