#     composer and the phone can never double-answer). Host-only plugin,
#     absolute path — same shape as rows 5/6 (arxa-memory, arxa-pi-delegate).
- insert:
  - id: arxa-approvals
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa-studio/plugins/approvals/lib/index.js

# 15. Artifact viewer-editor (D7 + D78-D87, 2026-08-30): the per-org,
