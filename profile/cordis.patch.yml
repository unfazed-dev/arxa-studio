# The arxa profile patch — materialized by bin/arxa.mjs into
# $DSH_HOME/profiles/arxa/cordis.patch.yml, applied after the bundle layers.
#
# Three patches, each earning its row (arxa-harness-and-distribution.md):
#
# 1. Identity. dsh-base's `system-prompt` entry ships
#    "You are an AI agent powered by DeepSeek Harness." behind
#    `includeHarnessIdentity` (default true) with an empty persona slot —
#    so arxa's identity is a CONFIG override, one rung above the plan's
#    "register a replacement plugin" (the plugin swap stays available if a
#    future dsh drops the flag). NOTE: a non-insert patch REPLACES the whole
#    `config` object (applyEntryPatches: target[key] = value), so this block
#    must stay complete, not minimal.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: >-
      You are arxa, the agentic app studio harness by Totem Labs. You drive
      the appbox engine through its pipeline stages and its gates decide what
      ships.

# 2. Repo law only. dsh reads BOTH AGENTS.md and CLAUDE.md by default
#    (dsh-agent-instructions instructionFileCandidates), which feeds it
#    Claude-Code-only MCP routing rules. Config fix, not file layout
#    (H1 amendment 3). maxBytes restated because config replaces wholesale.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: [AGENTS.md]

# 3. The appbox gate on every mutating tool call (harness/README.md template;
#    absolute path because arxa declares no npm dependency on the plugin).
- insert:
  - id: appbox-gate
    name: /Volumes/developer_ssd/Developer/totem_labs/app-box/harness/dsh-external-gate/index.mjs
    config:
      command: /Volumes/developer_ssd/Developer/totem_labs/app-box/harness/verdict.sh
      # dsh-native tool names (dsh-tool-fs registers write/edit, not Write/Edit).
      # The 2026-08-21 booted check proved Claude-cased names match nothing here.
      tools: [write, edit, str_replace_editor, bash]
      timeoutMs: 5000

# 4. Project memory injection (H5): shells `appbox memory recall` for the
#    boot cwd and registers it as a system-prompt section. Absolute path —
#    host-only plugin, no client half to discover.
- insert:
  - id: arxa-memory
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa-harness/plugins/memory/index.mjs
    config:
      project: !!js process.cwd()

# 5. The design panel (H4, viewer-first): shell.overlay dock iframing a live
#    `appbox design serve` with the viewport-rung ladder. By PACKAGE NAME —
#    the browser half is discovered through the package.json dsh.client
#    declaration, which a file-path entry has no association to; bin/arxa.mjs
#    materializes the file: dependency into the profile package.json.
- insert:
  - id: arxa-design-panel
    name: arxa-design-panel
