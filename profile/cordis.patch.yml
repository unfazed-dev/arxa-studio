# The arxa profile patch — materialized by bin/arxa-studio.mjs into
# $DSH_HOME/profiles/arxa/cordis.patch.yml, applied after the bundle layers.
#
# Each patch earns its row (arxa-harness-and-distribution.md):
#
# 1. Identity. dsh-base's `system-prompt` entry ships
#    "You are an AI agent powered by DeepSeek Harness." behind
#    `includeHarnessIdentity` (default true) with an empty persona slot —
#    so arxa's identity is a CONFIG override, one rung above the plan's
#    "register a replacement plugin" (the plugin swap stays available if a
#    future dsh drops the flag). NOTE: a non-insert patch REPLACES the whole
#    `config` object (applyEntryPatches: target[key] = value), so this block
#    must stay complete, not minimal.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: >-
      You are arxa, the agentic app studio harness by Totem Labs. You drive
      the arxa engine through its pipeline stages and its gates decide what
      ships.

# 2. Repo law only. dsh reads BOTH AGENTS.md and CLAUDE.md by default
#    (dsh-agent-instructions instructionFileCandidates), which feeds it
#    Claude-Code-only MCP routing rules. Config fix, not file layout
#    (H1 amendment 3). maxBytes restated because config replaces wholesale.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: [AGENTS.md]

# 3. Silence the DeepSeek-worded web-surface identity. dsh-web-app's
#    web-runtime row injects "DeepSeek Harness Web GUI" into the system
#    prompt (plus a harness-source section and the DSH_WEB_URL shell
#    variable) behind surfaceContext. arxa-brand (row below) re-registers
#    the orientation arxa-worded; the other two are deliberately dropped.
#    Config replaces wholesale, so printUrl/trustedHosts are restated —
#    and so is openBrowser: dropping it silently falls back to the schema
#    default (true), which made every server boot open a browser tab that
#    presence then denied and closed. Restating the webStartup wiring keeps
#    `--no-open` (launchd wrapper + desktop sidecar spawn) honored while
#    standalone `arxa-studio` browser mode still auto-opens.
#    Headless profiles have no web-runtime row — the loader warns and skips.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# 4. The arxa gate on every mutating tool call (harness/README.md template;
#    absolute path because arxa declares no npm dependency on the plugin).
- insert:
  - id: arxa-gate
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa/harness/dsh-external-gate/index.mjs
    config:
      command: /Volumes/developer_ssd/Developer/totem_labs/arxa/harness/verdict.sh
      # dsh-native tool names (dsh-tool-fs registers write/edit, not Write/Edit).
      # The 2026-08-21 booted check proved Claude-cased names match nothing here.
      tools: [write, edit, str_replace_editor, bash]
      timeoutMs: 5000

# 5. Project memory injection (H5): shells `arxa memory recall` for the
#    boot cwd and registers it as a system-prompt section. Absolute path —
#    host-only plugin, no client half to discover.
- insert:
  - id: arxa-memory
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa-studio/plugins/memory/index.mjs
    config:
      project: !!js process.cwd()

# 6. Pi as a delegated subagent engine (decision 3ii): one tool, delegate_pi,
#    one-shot `pi -p` in the workspace. The spawned Pi inherits
#    PI_CODING_AGENT_DIR=~/.arxa/pi from bin/arxa-studio.mjs, so the arxa gate
#    extension rides along. Absolute path — host-only plugin.
- insert:
  - id: arxa-pi-delegate
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa-studio/plugins/pi-delegate/index.mjs

# 7. The design panel (H4, viewer-first): shell.overlay dock iframing a live
#    `arxa design serve` with the viewport-rung ladder. By PACKAGE NAME —
#    the browser half is discovered through the package.json dsh.client
#    declaration, which a file-path entry has no association to; bin/arxa-studio.mjs
#    materializes the file: dependency into the profile package.json.
- insert:
  - id: arxa-design-panel
    name: arxa-design-panel

# 8. arxa branding (web surface): moss-green accent palette, arxa wordmark
#    over the baked-in brand SVG, tab title/favicon (browser half), and the
#    arxa-worded web-surface prompt section replacing the one row 3 disabled
#    (host half). By PACKAGE NAME — the browser half is discovered through
#    package.json dsh.client, same as the design panel.
- insert:
  - id: arxa-brand
    name: arxa-brand

# 9. arxa generative UI: the `gen_ui` tool (host half) plus the keyed
#    `tool.call.toolview` renderer for it (browser half), so a tool result
#    becomes live React inline in the conversation instead of prose.
#    Stages 1-3 of arxa/docs/plans/inline-generative-ui-in-dsh.md.
#    By PACKAGE NAME — the browser half is discovered through package.json
#    dsh.client, same as the design panel and brand rows above.
- insert:
  - id: arxa-gen-ui
    name: arxa-gen-ui

# 10. arxa as an MCP Apps host (SEP-1865) — stage 4. DISABLED BY DEFAULT
#     because it needs a real MCP server to point at; uncomment BOTH rows to
#     enable one.
#
#     TWO rows are required and this is not an oversight. dsh's own
#     mcp-client is what registers the server's tools with the model; it drops
#     `_meta` at the boundary, so it can never carry UI. arxa-mcp-apps opens a
#     second, read-only connection to the SAME server purely to discover
#     `ui://` templates, and renders them. Tools without UI keep their normal
#     row. Enable arxa-mcp-apps alone and nothing appears — there would be no
#     tool call to attach a view to.
#
#     `serverName` MUST match between the two rows: the qualified tool name
#     dsh builds (`mcp__<serverName>__<rawName>`) is the slot key the renderer
#     claims. A mismatch silently renders nothing.
#
#     The bundled plugins/mcp-apps/testserver.mjs is a working MCP App server
#     (a counter widget that calls back via tools/call) — point both rows at
#     it to see the whole path end to end.
#
# - insert:
#   - id: mcp-arxatest
#     name: '@deepseek-ai/dsh-mcp-client'
#     config:
#       serverName: arxatest
#       transport: stdio
#       command: node
#       args:
#         - /Volumes/developer_ssd/Developer/totem_labs/arxa-studio/plugins/mcp-apps/testserver.mjs
#
# - insert:
#   - id: arxa-mcp-apps
#     name: arxa-mcp-apps
#     config:
#       serverName: arxatest
#       transport: stdio
#       command: node
#       args:
#         - /Volumes/developer_ssd/Developer/totem_labs/arxa-studio/plugins/mcp-apps/testserver.mjs

# 11. Waiting-page / browser-surface lifecycle (desktop-first, 2026-08-27):
#     the desktop app OWNS the studio server — when it quits the server tree
#     dies, so every served page carries a heartbeat that overlays the
#     branded "Waiting for main app to start…" page on loss and reloads on
#     recovery. The same plugin holds the server-side presence referee:
#     while the shell beats, browser tabs park ("running as the desktop
#     app"); with the app closed, at most ONE tab across all browsers. The
#     only override is the Settings > General "Open in browser" CTA (single
#     -use token via /__arxa/presence/open-browser). By PACKAGE NAME — the
#     browser half (the settings row) is discovered through package.json
#     dsh.client, same as the design panel.
- insert:
  - id: arxa-waiting-page
    name: arxa-waiting-page
