#     dies, so every served page carries a heartbeat that overlays the
#     branded "Waiting for main app to start…" page on loss and reloads on
#     recovery. The same plugin holds the server-side presence referee:
#     while the shell beats, browser tabs park ("running as the desktop
#     app"); with the app closed, at most ONE tab across all browsers. The
#     only override is the Settings > General "Open in browser" CTA (single
#     -use token via /__arxa/presence/open-browser). By PACKAGE NAME — the
#     browser half (the settings row) is discovered through package.json
#     dsh.client, same as the design panel.
- insert:
  - id: arxa-waiting-page
    name: arxa-waiting-page

