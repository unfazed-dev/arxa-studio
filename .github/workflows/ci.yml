# arxa-studio engine CI — runs on the self-hosted mac runner (same fleet as
# arxa's desktop release CI). This is the repo-level proof that the shared
# CI process works for arxa-studio, per the standing instruction that the
# self-hosted CI process is ensured for arxa, arxa-studio, and arxa-built apps.
#
# The engine has no test suite yet; this gates on:
#   1. syntax integrity of every .js/.mjs in bin/, scripts/, plugins/
#   2. a smoke run of the studio CLI entrypoint (--help must exit 0)
# Add real test scripts to package.json and wire them in here as they appear.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64, arxa]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check engine sources
        run: |
          fails=0; total=0
          while IFS= read -r f; do
            total=$((total+1))
            node --check "$f" || { fails=$((fails+1)); echo "::error file=$f::syntax check failed"; }
          done < <(find bin scripts plugins \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*')
          echo "checked $total files, $fails failures"
          [ "$fails" -eq 0 ]

      - name: Install dependencies
        # The studio CLI refuses to fall back to the operator's ~/.dsh install
        # (unpinned); it requires deps installed in the workspace itself.
        run: npm ci

      - name: Plugin selftests + sidebar smoke (rebuild gate included)
        run: npm test

      - name: Smoke-run studio CLI (--help)
        run: |
          # macOS has no `timeout`; guard against a hung CLI with a background killer.
          node bin/arxa-studio.mjs --help &
          PID=$!
          ( sleep 60; kill "$PID" 2>/dev/null ) &
          KILLER=$!
          if wait "$PID"; then
            kill "$KILLER" 2>/dev/null || true
            echo "smoke ok"
          else
            echo "::error::studio CLI smoke run failed or hung"
            exit 1
          fi

  supabase-conformance:
    # The REAL disposable local-Supabase leg of the workspace-provider smoke
    # (task 14): a scratch-copy stack on pinned reserved ports (54921/54922),
    # the shipped migrations applied to an empty stack and applied twice, two
    # users / two orgs, raw authenticated RLS/IDOR replay, the FULL
    # conformance kit (cross-org isolation GREEN required) and the
    # local → Supabase → local migration with hash-equal portable data, then
    # migration reversal on the disposable database. The smoke script stops
    # and wipes its stack on success, failure, and signal; it never touches
    # the operator's own supabase state. The ordinary `npm test` covers the
    # same checks offline through the injected protocol fake; this job exists
    # to exercise the real stack (Docker daemon required — skip loudly, same
    # convention as the linux lane below).
    runs-on: [self-hosted, macOS, ARM64, arxa]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker available
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then echo "up=yes" >> "$GITHUB_OUTPUT"
          else echo "up=no" >> "$GITHUB_OUTPUT"; echo "::warning::Docker is not running — the Supabase conformance leg did not execute"; fi

      - name: Supabase CLI at the pinned version
        if: steps.docker.outputs.up == 'yes'
        run: |
          command -v supabase >/dev/null || { echo "::error::supabase CLI not installed on the runner"; exit 1; }
          v=$(supabase --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ "$v" = "2.67.1" ] || { echo "::error::supabase CLI $v ≠ pinned 2.67.1 — update the pin deliberately, in lockstep with scripts/workspace-provider-supabase-smoke.mjs"; exit 1; }

      - name: Disposable local-Supabase conformance (real stack)
        if: steps.docker.outputs.up == 'yes'
        run: node scripts/workspace-provider-supabase-smoke.mjs --real

  linux:
    # The Linux lane (docs/plans/linux-omarchy-port.md D11). Same self-hosted mac,
    # but the work happens inside the Arch image the dev loop uses, so a
    # macOS-only call — an osascript, a ~/Library path, a launchctl — goes red
    # here the day it lands instead of on the Omarchy box weeks later.
    #
    # Engine only: no cargo, no window. The Rust shell changes rarely and takes
    # ~20 minutes to build; the plugin tree changes constantly and takes three.
    runs-on: [self-hosted, macOS, ARM64, arxa]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker available
        # Docker Desktop is not a service on this runner; skip loudly rather
        # than fail the build when it is not up.
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then echo "up=yes" >> "$GITHUB_OUTPUT"
          else echo "up=no" >> "$GITHUB_OUTPUT"; echo "::warning::Docker is not running — the Linux lane did not execute"; fi

      - name: Build the Arch image
        if: steps.docker.outputs.up == 'yes'
        run: docker build -f scripts/linux/Dockerfile.arch -t arxa-arch:arm64 scripts/linux

      - name: Engine layer on Arch
        if: steps.docker.outputs.up == 'yes'
        # --fresh so a stale work volume cannot make a red run look green.
        run: ./scripts/linux/run-container.sh --fresh engine
