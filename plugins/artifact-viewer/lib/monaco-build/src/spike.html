<!doctype html><meta charset="utf-8"><title>monaco spike</title>
<style>html,body{margin:0;height:100%}#ed{position:absolute;inset:0}#diff{position:absolute;left:-9999px;width:800px;height:300px}#part{position:absolute;inset:0;display:none}#part.on{display:block}</style>
<div id="ed"></div>
<div id="diff"></div>
<div id="part"></div>
<script type="module">
  const RS = 'use std::collections::HashMap;\n\n/// squares 1..=n\nfn squares(n: i32) -> HashMap<i32, i32> {\n    (1..=n).map(|x| (x, x * x)).collect()\n}\n\n// a deliberately long line so word wrap has something to act on: lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor\nfn main() {\n    let m = squares(5);\n    println!("{:?}", m.get(&3));\n}\n'
  const DART = 'void main() {\n  final xs = <int>[1, 2, 3];\n  print(xs.map((x) => x * x).toList());\n}\n'
  const RS2 = RS.replace('squares(5)', 'squares(9)')
  const el = document.getElementById('ed')
  const settle = (ms) => new Promise((r) => setTimeout(r, ms))
  // monaco paints every space in .view-lines as U+00A0, so innerText never
  // matches a plain-space prefix. Cost two red assertions that were both
  // describing correct behaviour.
  const viewText = () => (document.querySelector('#part .monaco-editor .view-lines')?.innerText ?? '')
    .replace(/\u00a0/g, ' ')
  // Published IMMEDIATELY and mutated in place: if a step hangs or throws, the
  // lens still sees how far the page got instead of `__spike is undefined`.
  const out = { step: 'start' }
  window.__spike = out
  window.addEventListener('error', (e) => {
    // WebKit reports this benign observer warning through onerror; Chrome
    // never does. It is not a fault — the loop just ran out of frame budget.
    if (/ResizeObserver loop/.test(String(e.message))) return
    out.error = String(e.message)
  })
  // Which STEP produces the stray rejection? The console shows the stack but
  // not the moment, and the whole point is to know what to stop doing.
  out.rejects = []
  window.addEventListener('unhandledrejection', (e) => {
    out.rejects.push(out.step + '=' + String((e.reason && (e.reason.name || e.reason.message)) ?? e.reason))
  })

  const m = await import('/__arxa/artifacts/vendor/arxa-monaco.js')

  out.step = 'open-rust'
  // 1. open a rust file
  let h = await m.openFile(el, '/spike/main.rs', RS, { onChange: () => { out.changed = true } })
  await settle(2500)
  out.editor = !!h.editor
  out.lines = h.model.getLineCount()
  out.lang = h.model.getLanguageId()
  out.tokens = document.querySelectorAll('.monaco-editor .view-line span').length
  out.langs = m.monaco.languages.getLanguages().length

  out.step = 'switch-dart'
  // 2. switch to a DIFFERENT file — a second language, from a second extension
  h.dispose()
  h = await m.openFile(el, '/spike/main.dart', DART)
  await settle(1200)
  out.lang2 = h.model.getLanguageId()

  out.step = 'reopen-rust'
  // 3. come back to the FIRST path with CHANGED bytes. The overlay used to
  //    stack per open, so createModelReference handed back the first model and
  //    this showed the ORIGINAL text. This is the reopen regression.
  h.dispose()
  h = await m.openFile(el, '/spike/main.rs', RS2, { onChange: () => { out.changed = true } })
  await settle(1200)
  out.reopenLang = h.model.getLanguageId()
  out.reopenFresh = h.model.getValue().includes('squares(9)')
  out.reopenNoStale = !h.model.getValue().includes('squares(5)')

  out.step = 'adapter-edit'
  // 4. the adapter the client drives: getText + replaceRange (what the
  //    prettier format action uses) must keep the model in step.
  const before = h.getText()
  const at = before.indexOf('squares(9)')
  h.replaceRange(at, at + 10, 'squares(7)')
  out.edited = h.getText().includes('squares(7)')
  out.onChangeFired = out.changed === true

  out.step = 'editor-worker'
  // 5. force an EDITOR-WORKER round trip. Nothing in the spike had ever asked
  //    MonacoEnvironment.getWorker for a label, so the label map was written
  //    on faith. Diff computation runs in TextEditorWorker.
  const de = m.monaco.editor.createDiffEditor(document.getElementById('diff'), { automaticLayout: false })
  de.setModel({
    original: m.monaco.editor.createModel(RS, 'rust'),
    modified: m.monaco.editor.createModel(RS2, 'rust'),
  })
  for (let i = 0; i < 60 && !(de.getLineChanges() || []).length; i++) await settle(100)
  out.diffChanges = (de.getLineChanges() || []).length
  out.workerLabels = (self.__arxaWorkerLabels || []).join(',')
  out.workerAsked = (self.__arxaWorkerLabels || []).length > 0

  out.step = 'theme-flip'
  // 6. the theme flip must reach an already-open editor
  const bgOf = () => getComputedStyle(document.querySelector('.monaco-editor')).getPropertyValue('--vscode-editor-background').trim()
  out.bg = bgOf()
  m.setTheme(false)
  await settle(1200)
  out.bgLight = bgOf()
  out.themeFlipped = out.bgLight !== '' && out.bgLight !== out.bg
  m.setTheme(true)
  await settle(800)

  out.step = 'resize'
  // Responsiveness: the pane is user-resizable (drag the divider, resize the
  // window), so the editor must FOLLOW its container, not keep its first size.
  const w0 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  el.style.right = '600px'          // shrink the container
  await settle(1200)
  const w1 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  el.style.right = '0px'            // and back
  await settle(1200)
  const w2 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  out.resizeShrank = w1 < w0 - 50
  out.resizeRestored = Math.abs(w2 - w0) < 5
  out.widths = [Math.round(w0), Math.round(w1), Math.round(w2)].join('/')

  // Narrow-pane SHAPE, not just size. The viewer is a side pane and gets
  // dragged small; the minimap and gutters have to get out of the way and long
  // lines have to wrap rather than run off the side.
  const minimapOn = () => !!document.querySelector('.monaco-editor .minimap') &&
    document.querySelector('.monaco-editor .minimap').getBoundingClientRect().width > 0
  const wraps = () => h.editor.getOption(m.monaco.editor.EditorOption.wrappingInfo).isViewportWrapping
  out.wideMinimap = minimapOn()
  out.wideNoWrap = !wraps()
  el.style.right = (window.innerWidth - 480) + 'px'   // a realistically narrow pane
  await settle(1200)
  out.narrowMinimap = minimapOn()
  out.narrowWraps = wraps()
  el.style.right = (window.innerWidth - 300) + 'px'   // very narrow
  await settle(1200)
  out.tinyLineNumbers = h.editor.getOption(m.monaco.editor.EditorOption.lineNumbers).renderType
  el.style.right = '0px'
  await settle(1200)
  out.restoredMinimap = minimapOn()

  // The user's bug, asserted as geometry: with no stylesheet the editor's
  // lines escape the container and paint at the top-left of the PAGE.
  const box = el.getBoundingClientRect()
  const lines = document.querySelector('.monaco-editor .view-lines')
  const lb = lines ? lines.getBoundingClientRect() : null
  out.contained = !!lb && lb.left >= box.left - 1 && lb.top >= box.top - 1 &&
    lb.right <= box.right + 1 && lb.width > 0
  out.styled = !!lines && getComputedStyle(document.querySelector('.monaco-editor')).position !== 'static'
  // 2c: the monaco language id of every extension the LSP rows claim. A
  // documentSelector matches on the language id, and a mismatch is SILENT —
  // the client starts, the server runs, no document is ever synced and no
  // underline ever appears. `plaintext` here means a dead row.
  out.step = 'language-ids'
  out.ids = {}
  for (const ext of ['ts', 'tsx', 'mts', 'cts', 'js', 'jsx', 'mjs', 'cjs', 'html', 'css', 'scss', 'less', 'json', 'jsonc']) {
    try {
      const mdl = m.monaco.editor.createModel('', undefined, m.monaco.Uri.parse('file:///spike/probe.' + ext))
      out.ids[ext] = mdl.getLanguageId()
      mdl.dispose()
    } catch (e) { out.ids[ext] = 'ERR:' + String(e && e.message || e) }
  }
  // Phase 3 probe: what does the markdown extension actually give us?
  out.step = 'markdown-probe'
  let mdHandle = null
  try {
    h.dispose()   // the resize block left an editor in the container
    mdHandle = await m.openFile(el, '/spike/notes.md', '# Title\n\nsome *text* and a [link](x.md)\n\n```rs\nfn f(){}\n```\n')
    await settle(1500)
    out.mdLang = mdHandle.model.getLanguageId()
    out.mdTokens = document.querySelectorAll('.monaco-editor .view-line span').length
    out.mdColoured = new Set([...document.querySelectorAll('.monaco-editor .view-line span')]
      .map((n) => getComputedStyle(n).color)).size
    // left OPEN on purpose: the final capture then shows a real markdown file
    // with its grammar, instead of a blank page.
  } catch (e) { out.mdErr = String(e && e.message || e) }
  // Did the WEBWORKER EXTENSION HOST actually start? It runs inside an iframe.
  // No iframe means no extension code ever runs — which is exactly how
  // markdown-language-features looked "installed" while doing nothing at all.
  // Give activation (onLanguage:markdown fires from the open above) time to
  // either work or throw; a throw lands in the console and the lens fails it.
  out.step = 'ext-host'
  await settle(3000)
  out.extHostFrames = document.querySelectorAll('iframe').length

  // ---- the EDITOR PART ---------------------------------------------------
  // Everything above drives a bare monaco editor over a model. This drives VS
  // Code: hand it a uri, let it pick the editor. It is the only way a webview
  // (markdown preview) or a custom editor (media-preview's png viewer) can
  // ever open, and it is the thing the plan claimed would cost the whole
  // workbench chrome. attachPart takes ONE part.
  out.step = 'attach-part'
  try {
    // BOTH standalone editors must go first. wrapOpenEditor looks for an
    // existing StandaloneEditor whose model uri matches the resource and, if it
    // finds one, focuses THAT and never touches the editor part — measured: the
    // file landed in standalone group -4 while the part's group 0 stayed empty.
    // The two lanes cannot share a uri, which is the whole reason the code lane
    // has to move off monaco.editor.create.
    h.dispose()
    if (mdHandle) mdHandle.dispose()
    // Let the teardown settle before attaching the part. Disposing a standalone
    // editor cancels its in-flight work, and VS Code signals cancellation by
    // rejecting; attaching and opening in the same tick raced that rejection
    // into an unhandled `Canceled: Canceled` about half the time.
    await settle(500)
    el.style.display = 'none'
    const partEl = document.getElementById('part')
    partEl.className = 'on'
    await m.attachEditorPart(partEl)
    await settle(800)
    // No chrome came with it: the pane must not sprout an activity bar,
    // a sidebar, a panel or a status bar.
    // The other parts get CONSTRUCTED by the layout whether or not they are
    // attached; what matters is whether any of them paints. Measure the box,
    // not the existence of a node.
    out.partChrome = ['activitybar', 'sidebar', 'panel', 'statusbar']
      .filter((k) => [...document.querySelectorAll('.part.' + k)]
        .some((n) => n.getBoundingClientRect().width > 0 && n.getBoundingClientRect().height > 0))
    out.partMounted = partEl.querySelector('.part.editor') !== null
    const pe = partEl.querySelector('.part.editor')
    out.partBox = pe ? Math.round(pe.getBoundingClientRect().width) + 'x' + Math.round(pe.getBoundingClientRect().height) : 'none'

    out.step = 'open-through-vscode'
    try { out.vsPane = String(await m.openEditor('/spike/notes.md')) }
    catch (e) { out.vsOpenErr = String(e && e.message || e) }
    await settle(2500)
    out.vsOpened = document.querySelector('#part .monaco-editor') !== null
    out.vsTabs = document.querySelectorAll('#part .tabs-container .tab').length
    out.vsText = viewText().slice(0, 40)
    try { Object.assign(out, await m.editorPartInfo()) } catch (e) { out.infoErr = String(e && e.message || e) }
    const pEl = document.getElementById('part')
    out.partHtml = (pEl.innerHTML || '').length
    // querySelector does not pierce a shadow root, and monaco-vscode-api puts
    // the workbench in one for style isolation. Walk both.
    const roots = [document]
    for (const n of document.querySelectorAll('*')) if (n.shadowRoot) roots.push(n.shadowRoot)
    out.shadowRoots = roots.length - 1
    out.anyEditor = roots.some((r) => r.querySelector('.monaco-editor') !== null)
    out.anyTab = roots.reduce((a, r) => a + r.querySelectorAll('.tab').length, 0)
    out.partClasses = [...pEl.querySelectorAll('*')].slice(0, 14).map((n) => n.className && String(n.className).slice(0, 28)).filter(Boolean).join('|')

    out.step = 'markdown-preview'
    const before = document.querySelectorAll('iframe').length
    await m.runCommand('markdown.showPreview')
    await settle(4000)
    out.previewFrames = document.querySelectorAll('iframe').length - before
    // A webview is an iframe whose document actually rendered the markdown.
    // Counting frames alone would pass on an empty one.
    out.previewTitle = [...document.querySelectorAll('iframe')]
      .map((f) => { try { return f.contentDocument?.body?.innerText ?? '' } catch { return '' } })
      .some((t) => t.includes('Title'))
    // ---- a CUSTOM EDITOR: media-preview's image viewer -------------------
    // A binary file, drawn here rather than shipped: RegisteredMemoryFile takes
    // string | Uint8Array, and the whole question is whether a non-text file can
    // reach a webview-backed custom editor at all. It is the same door the PDF
    // question sits behind.
    out.step = 'image-preview'
    const cv = document.createElement('canvas')
    cv.width = 64; cv.height = 64
    const cx = cv.getContext('2d')
    cx.fillStyle = '#e0562d'; cx.fillRect(0, 0, 64, 64)
    cx.fillStyle = '#ffffff'; cx.fillRect(16, 16, 32, 32)
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'))
    const bytes = new Uint8Array(await blob.arrayBuffer())
    out.pngBytes = bytes.length
    await m.registerFile('/spike/pic.png', bytes)
    const framesBeforeImg = document.querySelectorAll('iframe').length
    await m.openEditor('/spike/pic.png')
    await settle(3000)
    const info2 = await m.editorPartInfo()
    out.imgPane = info2.paneId
    out.imgActive = info2.active
    out.imgFrames = document.querySelectorAll('iframe').length - framesBeforeImg

    // ---- close / reopen / external change --------------------------------
    // The one-overlay finding (registerFileSystemOverlay stacks; disposing it
    // breaks reload) was measured against createModelReference, not against the
    // text-file service the part uses. The viewer switches files constantly, so
    // this cycle is the normal path, not an edge.
    out.step = 'cycle'
    await m.closeAll()
    await settle(400)
    out.closedTabs = document.querySelectorAll('#part .tab').length
    await m.openEditor('/spike/notes.md')
    await settle(1200)
    out.reopenText = viewText().slice(0, 12)
    await m.updateFile('/spike/notes.md', '# Changed\n\nnew bytes from disk\n')
    await settle(1500)
    out.afterChange = viewText().slice(0, 12)

    // ---- external change on a DIRTY file ---------------------------------
    // The viewer has its own conflict banner. VS Code's text-file service has
    // opinions about a file changing on disk under unsaved edits too, and two
    // prompts for one event would be a regression. Measured, not assumed.
    out.step = 'dirty-conflict'
    const dh = await m.openFile(partEl, '/spike/notes.md', '# Changed\n\nnew bytes from disk\n')
    dh.editor.executeEdits('spike', [{
      range: new m.monaco.Range(1, 1, 1, 1), text: 'EDITED ',
    }])
    await settle(400)
    out.dirtyBefore = dh.getText().startsWith('EDITED')
    await m.updateFile('/spike/notes.md', '# Third\n\nbytes changed on disk\n')
    await settle(2000)
    out.dialogs = document.querySelectorAll('.monaco-dialog-box, .dialog-message').length
    out.afterConflict = dh.getText().slice(0, 14)

    // ---- the LANGUAGE CLIENT ---------------------------------------------
    // Against a stub server on this origin (see check.mjs). This is the only
    // browser proof the LSP lane survived moving off standalone editors: the
    // client matches on language id, and the document it has to sync is now
    // created by VS Code's textFileEditor, not by monaco.editor.create.
    out.step = 'lsp'
    out.lspStarted = await m.connectLanguageServer('markdown', {
      url: 'ws://' + location.host + '/__arxa/artifacts/vendor/lsp-stub',
      token: 'stub', relPath: 'notes.md', selector: ['markdown'],
    })
    await settle(2500)
    const mk = m.monaco.editor.getModelMarkers({ resource: m.monaco.Uri.file('/spike/notes.md') })
    out.lspMarkers = mk.length
    out.lspSource = mk.length > 0 ? String(mk[0].source ?? '') : ''
    out.lspLangs = m.languageServers().join(',')

    // ---- the DIFF editor --------------------------------------------------
    // Replaces CodeMirror's unifiedMergeView. Both sides are resources, so the
    // original gets its own uri — a second model on the file's own uri would
    // collide with the one the editor already holds.
    out.step = 'diff'
    const diffPane = await m.openDiff('/spike/notes.md', '# Title\n\nold bytes\n', { sideBySide: false, editable: false })
    await settle(2000)
    // A read-only file must stay read-only in the DIFF too. The modified side is
    // the file's own model, and onChange/auto-save watch that model — so if the
    // flag stops at the code editor, the diff becomes a back door that writes.
    // The marks must PAINT, not just exist: a decoration whose theme colour
    // never resolved is a transparent box, and the diff reads as plain text.
    {
      const dEl = document.querySelector('.monaco-diff-editor')
      const bg = (sel) => { const el = dEl && dEl.querySelector(sel); return el ? getComputedStyle(el).backgroundColor : 'NONE' }
      out.diffInsBg = bg('.line-insert')
      out.diffDelBg = bg('.line-delete')
    }
    const dctl = diffPane != null && typeof diffPane.getControl === 'function' ? diffPane.getControl() : null
    const dmod = dctl != null && typeof dctl.getModifiedEditor === 'function' ? dctl.getModifiedEditor() : null
    out.diffModRO = dmod != null ? !!dmod.getOption(m.monaco.editor.EditorOption.readOnly) : null
    if (dmod != null) {
      // `type` is the USER's path and honours readOnly; executeEdits bypasses it.
      const before = dmod.getModel().getValue()
      dmod.focus()
      dmod.trigger('arxa-probe', 'type', { text: 'ZZ' })
      out.diffTyped = dmod.getModel().getValue() !== before
      if (out.diffTyped) dmod.trigger('arxa-probe', 'undo', null)
    }
    // …and it must SURVIVE a settings write. VS Code recomputes an editor's
    // options on every configuration change, deriving readOnly from the input
    // (writable overlay -> false), so a one-shot updateOptions could be undone
    // by the very next write. openFile's ResizeObserver writes layoutFor on
    // every width-shape change, and the diff tab is live while that happens —
    // so narrowing the part is the real path, not a contrived one.
    const partW = document.getElementById('part')
    partW.style.right = 'auto'
    partW.style.width = '400px'   // crosses minimap/wordWrap/folding/lineNumbers
    await settle(1500)
    out.diffModRO2 = dmod != null ? !!dmod.getOption(m.monaco.editor.EditorOption.readOnly) : null
    if (dmod != null) {
      const before2 = dmod.getModel().getValue()
      dmod.focus()
      dmod.trigger('arxa-probe', 'type', { text: 'ZZ' })
      out.diffTyped2 = dmod.getModel().getValue() !== before2
      if (out.diffTyped2) dmod.trigger('arxa-probe', 'undo', null)
    }
    partW.style.width = ''
    partW.style.right = '0'
    await settle(500)
    const info3 = await m.editorPartInfo()
    out.diffPane = info3.paneId
    out.diffTabs = document.querySelectorAll('#part .tab').length
    // The inline diff paints inserted/deleted line decorations; without them
    // this would be two editors showing the same thing.
    out.diffMarks = document.querySelectorAll('#part .monaco-editor .line-insert, #part .monaco-editor .line-delete, #part .monaco-editor .char-insert, #part .monaco-editor .char-delete').length

    // ---- the PRODUCT's container shape -----------------------------------
    // Everything above mounts into #part, which is position:absolute;inset:0 and
    // toggles display:none -> block. That toggle is a size CHANGE, so the
    // ResizeObserver _attachPart installs always fires with a real box.
    // client.js does none of that: the host div is a flex child that already has
    // its final size when the part is appended. _attachPart NEVER calls
    // layoutPart itself, so if that shape does not produce a resize callback
    // with a real box, the part is laid out at 0 and stays there — a blank pane.
    out.step = 'product-shape'
    const wrap = document.createElement('div')
    wrap.style.cssText = 'position:absolute;left:0;top:0;width:900px;height:500px;display:flex;flex-direction:column'
    const inner = document.createElement('div')
    // .aXa_av_editorWrap + .aXa_av_monaco, verbatim from client.js
    inner.className = 'aXa_av_monaco'
    inner.style.cssText = 'flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column'
    // client.js also ships this rule, written when .monaco-editor was the DIRECT
    // child of the host (monaco.editor.create). Under the editor part it is
    // buried under .part > .content > grid > group > .editor-container, so
    // height:100% resolves against a DIFFERENT parent than it used to.
    const prodCss = document.createElement('style')
    prodCss.textContent = '.aXa_av_monaco .monaco-editor{height:100%}'
    document.head.appendChild(prodCss)
    let host = document.createElement('div')
    host.style.cssText = 'flex:1;min-height:0'   // .aXa_av_lspHost
    inner.appendChild(host)
    wrap.appendChild(inner)
    document.body.appendChild(wrap)
    out.hostBox = Math.round(host.getBoundingClientRect().width) + 'x' + Math.round(host.getBoundingClientRect().height)
    await m.attachEditorPart(host)
    // The PRODUCT opens the file's REAL absolute path (client.js passes absPath
    // so the language server's diagnostics land on a path it has heard of).
    // Every probe above uses '/spike/main.rs' — synthetic, shallow, and not a
    // path any file service could resolve anywhere else. This is the one
    // difference the harness has never covered.
    const ABS = '/Volumes/business_ssd/RESTO/projects/kitchen-project/06-build/application/backoffice/lib/menu.dart'
    const habs = await m.openFile(host, ABS, DART, { editable: true })
    await settle(2500)
    out.absOpened = habs != null && habs.model != null
    out.absText = habs && habs.model ? habs.model.getValue().slice(0, 14) : ''
    const infoAbs = await m.editorPartInfo()
    out.absPane = infoAbs.paneId
    out.absRes = infoAbs.openRes || ''
    out.absLines = host.querySelectorAll('.view-line').length
    const partEl2 = host.querySelector('.part')
    const edEl2 = host.querySelector('.monaco-editor')
    const r1 = partEl2 ? partEl2.getBoundingClientRect() : null
    const r2 = edEl2 ? edEl2.getBoundingClientRect() : null
    out.prodPartBox = r1 ? Math.round(r1.width) + 'x' + Math.round(r1.height) : 'NO PART'
    out.prodEdBox = r2 ? Math.round(r2.width) + 'x' + Math.round(r2.height) : 'NO EDITOR'
    out.prodLines = host.querySelectorAll('.view-line').length

    // ---- the PRODUCT's markdown flow, sampled every frame -----------------
    // client.js opens an .md as source, then flips it to the rendered preview
    // (a webview), and both the diff and the next file start from THAT state.
    // The host moves away from 0,0 first: the preview iframe lives in a
    // position:fixed overlay on document.body, and a fixed box with no anchor
    // lands at the page's top-left — which in the studio is the sidebar.
    // ---- typed text must survive a remount -------------------------------
    // The panel remounts the CodeView when a note appears above it (the
    // "saved" note, 1.5s after the first keystroke), and the remount calls
    // openFile again with the text it LOADED, not the text on screen.
    out.step = 'remount-keeps-edit'
    const hk = await m.openFile(host, ABS, DART, { editable: true })
    await settle(500)
    hk.editor.focus()
    hk.editor.trigger('spike', 'type', { text: 'TYPED ' })
    await settle(1800)   // past any auto-save VS Code might run
    out.typedSeen = hk.getText().startsWith('TYPED ')
    hk.dispose()
    const hk2 = await m.openFile(host, ABS, DART, { editable: true })
    await settle(800)
    out.remountKeeps = hk2.getText().startsWith('TYPED ')
    out.remountText = hk2.getText().slice(0, 12)
    hk2.dispose()

    out.step = 'product-flow'
    wrap.style.left = '300px'; wrap.style.top = '80px'
    const flow = {}
    out.flow = flow
    const stray = []
    let sampling = true
    const sample = () => {
      if (!sampling) return
      const hr = host.getBoundingClientRect()
      for (const f of document.querySelectorAll('iframe')) {
        const r = f.getBoundingClientRect()
        if (r.width > 0 && r.height > 0 && f.checkVisibility({ visibilityProperty: true })
            && (r.left < hr.left - 2 || r.top < hr.top - 2 || r.right > hr.right + 2 || r.bottom > hr.bottom + 2)) {
          const key = out.step + ' ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height)
          if (!stray.includes(key)) stray.push(key)
        }
      }
      requestAnimationFrame(sample)
    }
    requestAnimationFrame(sample)
    // What is actually painted at the host's centre — a webview iframe, the
    // diff, a text editor, or something else.
    const onTop = () => {
      const hr = host.getBoundingClientRect()
      const el = document.elementFromPoint(hr.left + hr.width / 2, hr.top + hr.height / 2)
      if (!el) return 'none'
      if (el.tagName === 'IFRAME') return 'iframe'
      if (el.closest('.monaco-diff-editor')) return 'diff'
      if (el.closest('.monaco-editor')) return 'editor'
      return el.tagName + '.' + el.className
    }
    const MD1 = '/Volumes/business_ssd/RESTO/Notes/autumn-menu.md'
    const MD2 = '/Volumes/business_ssd/RESTO/Notes/allergen-policy.md'
    out.step = 'flow-md1'
    const hmd1 = await m.openFile(host, MD1, '# Autumn\n\nfirst body\n', { editable: true })
    await m.showMarkdownPreview(MD1)
    await settle(3000)
    flow.md1Top = onTop()
    // Between two files the product shows a loading hint, which UNMOUNTS the
    // CodeView: its host leaves the DOM while the preview webview is still
    // claimed, and the remount hands the part a NEW host. Measured live
    // (2026-09-07, Chrome and WebKit): the preview iframe sat at 0,0 300x150
    // for the whole gap — the studio's sidebar corner.
    out.step = 'flow-gap'
    hmd1.dispose()   // the CodeView effect cleanup runs at unmount
    wrap.remove()
    await settle(600)
    document.body.appendChild(wrap)
    const oldHost = host
    host = document.createElement('div')
    host.style.cssText = oldHost.style.cssText
    oldHost.replaceWith(host)
    out.step = 'flow-md2'
    const hmd2 = await m.openFile(host, MD2, '# Allergen\n\nsecond body\n', { editable: true })
    await m.showMarkdownPreview(MD2)
    await settle(3000)
    flow.md2Top = onTop()
    flow.md2Pane = (await m.editorPartInfo()).paneId
    out.step = 'flow-diff'
    // Narrower than VS Code's 900px inline breakpoint, with the product's own
    // call (no side-by-side override): the bundle's settings must still give
    // two columns, and the marks must carry colour.
    wrap.style.width = '700px'
    await m.openDiff(MD2, '# Allergen\n\nold body\n', { sideBySide: true, editable: true })
    await settle(2500)
    flow.diffTop = onTop()
    flow.diffPane = (await m.editorPartInfo()).paneId
    {
      const dEl = host.querySelector('.monaco-diff-editor')
      flow.diffSbs = dEl ? dEl.classList.contains('side-by-side') : null
      flow.diffWidth = dEl ? Math.round(dEl.getBoundingClientRect().width) : 0
      const el = dEl && dEl.querySelector('.line-insert, .line-delete')
      flow.diffBg = el ? getComputedStyle(el).backgroundColor : 'NONE'
    }
    wrap.style.width = '900px'
    out.step = 'flow-back'
    await m.showMarkdownPreview(MD2)
    await settle(2500)
    flow.backTop = onTop()
    out.step = 'flow-dart'
    hmd2.dispose()
    await m.openFile(host, ABS, DART, { editable: true })
    await settle(2500)
    flow.dartTop = onTop()
    flow.dartPane = (await m.editorPartInfo()).paneId
    sampling = false
    flow.stray = stray.slice(0, 10)
  } catch (e) { out.partErr = String(e && e.message || e) }
  out.step = 'done'

  // ---- the assertions -----------------------------------------------------
  // They live here, not in check.mjs, because --expect collapses to ONE boolean:
  // a 60-term conjunction that comes back false names nothing. Evaluated one at
  // a time so `out.fail` is the list of what actually broke, and --dump paints
  // it. check.mjs asserts only `out.fail.length === 0`.
  out.fail = []
  for (const src of [

      "out.step === 'done'",   // the page ran to the end
      'out.error === undefined',
      'out.editor === true',
      'out.lines === 13',
      "out.lang === 'rust'",
      'out.tokens > 20',
      "out.lang2 === 'dart'",          // a second extension's grammar
      // markdown was opening as `plaintext` — the grammar extension was missing
      // while the FEATURE extension was present, which looks like markdown is
      // handled and is not.
      "out.mdLang === 'markdown'",
      // 2c: every extension an LSP row claims must resolve to a real language
      // id. `plaintext` would be a row that starts a server and syncs nothing.
      "out.ids.ts === 'typescript'",
      "out.ids.tsx === 'typescriptreact'",
      "out.ids.mts === 'typescript'",
      "out.ids.cts === 'typescript'",
      "out.ids.js === 'javascript'",
      "out.ids.jsx === 'javascriptreact'",
      "out.ids.mjs === 'javascript'",
      "out.ids.cjs === 'javascript'",
      "out.ids.html === 'html'",
      "out.ids.css === 'css'",
      "out.ids.scss === 'scss'",
      "out.ids.less === 'less'",
      "out.ids.json === 'json'",
      "out.ids.jsonc === 'jsonc'",
      "out.reopenLang === 'rust'",
      'out.reopenFresh === true',      // reopen shows the NEW bytes
      'out.reopenNoStale === true',    // and not the old ones
      'out.edited === true',           // replaceRange (format action)
      'out.onChangeFired === true',    // onChange (dirty tracking)
      'out.diffChanges > 0',           // the editor worker answered
      // MEASURED labels, not guessed — the first map keyed a label monaco
      // never asks for, and only the ?? fallback hid it.
      "out.workerLabels.includes('editorWorkerService')",
      "out.workerLabels.includes('TextMateWorker')",
      'out.themeFlipped === true',     // live dark/light flip
      'out.styled === true',           // the bundle loaded its OWN css
      'out.contained === true',        // and the editor stayed in its box
      'out.resizeShrank === true',     // follows the container when it shrinks
      'out.resizeRestored === true',   // and when it grows back
      // Narrow-pane shape: the minimap and gutters get out of the way and long
      // lines wrap instead of running off the side.
      'out.wideMinimap === true',
      'out.wideNoWrap === true',
      'out.narrowMinimap === false',
      'out.narrowWraps === true',
      'out.tinyLineNumbers === 0',     // line numbers off when tiny
      'out.restoredMinimap === true',
      // Phase 3: the markdown open itself must not throw, and the webworker
      // extension host must actually be running — it is the thing that was
      // silently off while { url, options } was passed to an override that
      // destructures { enableWorkerExtensionHost, iframeAlternateDomain }.
      'out.mdErr === undefined',
      'out.extHostFrames >= 1',
      // Phase 7.1: VS Code's editor part, attached alone.
      'out.partErr === undefined',
      'out.partMounted === true',
      // attachPart takes ONE part. The plan once claimed adopting views meant
      // the whole workbench chrome in the docked pane; nothing else may paint.
      'out.partChrome.length === 0',
      // The file opens through IEditorService into VS Code's real file editor,
      // in the MAIN part's group — not the standalone group wrapOpenEditor
      // reuses when a monaco.editor.create editor already holds the uri.
      'out.vsOpened === true',
      "out.paneId === 'workbench.editors.files.textFileEditor'",
      // TWO editors, not one, and that is the point: the spike opens main.rs,
      // reopens it, then dart, then markdown — four opens — and VS Code's
      // preview tab is reused for all but the one that was EDITED (editing pins
      // a preview tab). Tabs track what the user is doing instead of piling up
      // one per file the sidebar touches.
      "out.mainGroups === '0:2'",
      'out.vsTabs === 2',
      // A webview. This is the whole point of the part.
      'out.previewFrames === 1',
      // Cancellation is swallowed on purpose; nothing ELSE may be rejecting.
      "out.rejects.every((r) => r.endsWith('=Canceled'))",
      // A CUSTOM EDITOR over binary bytes: media-preview's image viewer, on a
      // png built in the page. RegisteredMemoryFile takes string | Uint8Array,
      // so a non-text artifact can reach a webview-backed editor.
      'out.pngBytes > 0',
      "out.imgPane === 'WebviewEditor'",
      "out.imgActive === 'file:///spike/pic.png'",
      // close -> reopen -> external change. The viewer switches files
      // constantly, so this cycle is the normal path, not an edge — and the
      // one-overlay finding was measured against the OLD lane.
      'out.closedTabs === 0',
      "out.reopenText.startsWith('# Title')",
      // Bytes changed underneath an OPEN editor reach it with no reload call:
      // the fs provider fires the change and VS Code re-reads.
      "out.afterChange.startsWith('# Changed')",
      // The diff editor, which replaced CodeMirror's unifiedMergeView. Marks,
      // not just a pane id: two editors showing the same text would still be a
      // diff editor.
      "out.diffPane === 'workbench.editors.textDiffEditor'",
      'out.diffMarks > 0',
      // The read-only back door: see the diff step.
      'out.diffModRO === true',
      'out.diffTyped === false',
      // …and still read-only after a settings write reaches the live diff.
      'out.diffModRO2 === true',
      'out.diffTyped2 === false',
      // The product's own container shape and its REAL absolute file path.
      'out.prodPartBox === out.hostBox',
      'out.absOpened === true',
      'out.absLines > 0',
      "out.absPane === 'workbench.editors.files.textFileEditor'",
      "out.absRes.indexOf('menu.dart') !== -1",
      // The product's markdown flow: preview on top, the diff on top of the
      // preview, back to the preview, then a code file — and NO frame in which
      // a preview iframe is painted outside the host, including the unmount gap
      // between two files.
      "out.flow.md1Top === 'iframe'",
      "out.flow.md2Top === 'iframe'",
      "out.flow.diffTop === 'diff'",
      "out.flow.backTop === 'iframe'",
      "out.flow.dartTop === 'editor'",
      'out.flow.stray.length === 0',
      // What the user typed is still there after the panel remounts the editor.
      'out.typedSeen === true',
      'out.remountKeeps === true',
      // Two columns even in a 700px pane, and painted marks in both diffs.
      'out.flow.diffSbs === true',
      'out.flow.diffWidth < 800',
      "out.flow.diffBg !== 'NONE' && out.flow.diffBg !== 'rgba(0, 0, 0, 0)'",
      "out.diffInsBg !== 'NONE' && out.diffInsBg !== 'rgba(0, 0, 0, 0)'",
      "out.diffDelBg !== 'NONE' && out.diffDelBg !== 'rgba(0, 0, 0, 0)'",
      // The LSP lane, end to end in a browser: client started, the document VS
      // Code created was synced, and the server's diagnostic became a marker on
      // the model. A source pin alone once let this whole function be deleted.
      'out.lspStarted === true',
      "out.lspLangs === 'markdown'",
      'out.lspMarkers > 0',
      "out.lspSource === 'arxa-stub'",
      // External change under UNSAVED edits: VS Code must not raise a second
      // prompt on top of the viewer's own conflict banner, and must not throw
      // the user's edits away. Measured: no dialog, edits kept.
      'out.dirtyBefore === true',
      'out.dialogs === 0',
      "out.afterConflict.startsWith('EDITED')"
  ]) {
    let ok = false
    try { ok = !!new Function('out', 'return (' + src + ')')(out) } catch (e) { ok = false }
    if (!ok) out.fail.push(src)
  }
  // --expect reports one boolean for the whole run, so the only way to SEE
  // which probe failed is to paint the values into the page and read them off
  // the capture. Same technique that found scss/less opening as plaintext.
  const dump = document.createElement('pre')
  dump.style.cssText = 'position:absolute;inset:0;z-index:99999;background:#111;color:#0f0;font:13px/1.35 monospace;padding:16px;margin:0;white-space:pre-wrap'
  dump.textContent = 'FAILED (' + out.fail.length + '):\n' + out.fail.join('\n') + '\n\n' + JSON.stringify({
    partMounted: out.partMounted, partBox: out.partBox, partChrome: out.partChrome,
    vsOpened: out.vsOpened, vsTabs: out.vsTabs, vsText: out.vsText, vsOpenErr: out.vsOpenErr,
    vsPane: out.vsPane, editors: out.editors, active: out.active, partHtml: out.partHtml, infoErr: out.infoErr,
    shadowRoots: out.shadowRoots, anyEditor: out.anyEditor, anyTab: out.anyTab,
    paneId: out.paneId, groups: out.groups, parts: out.parts, mainGroups: out.mainGroups, openRes: out.openRes,
    groupActive: out.groupActive, notices: out.notices,
    previewFrames: out.previewFrames, previewTitle: out.previewTitle,
    extHostFrames: out.extHostFrames, partErr: out.partErr, mdErr: out.mdErr, error: out.error,
    rejects: out.rejects,
    pngBytes: out.pngBytes, imgPane: out.imgPane, imgActive: out.imgActive, imgFrames: out.imgFrames,
    closedTabs: out.closedTabs, reopenText: out.reopenText, afterChange: out.afterChange,
    diffPane: out.diffPane, diffTabs: out.diffTabs, diffMarks: out.diffMarks,
    diffModRO: out.diffModRO, diffTyped: out.diffTyped, diffInsBg: out.diffInsBg, diffDelBg: out.diffDelBg,
    diffModRO2: out.diffModRO2, diffTyped2: out.diffTyped2,
    hostBox: out.hostBox, prodPartBox: out.prodPartBox, prodEdBox: out.prodEdBox, prodLines: out.prodLines,
    absOpened: out.absOpened, absText: out.absText, absPane: out.absPane, absRes: out.absRes, absLines: out.absLines,
    lspStarted: out.lspStarted, lspMarkers: out.lspMarkers, lspSource: out.lspSource, lspLangs: out.lspLangs,
    dirtyBefore: out.dirtyBefore, dialogs: out.dialogs, afterConflict: out.afterConflict,
  }, null, 1)
  if (location.search.includes('dump')) document.body.appendChild(dump)
  try {
    await fetch('report', { method: 'POST', body: JSON.stringify({ step: out.step, fail: out.fail, flow: out.flow, typedSeen: out.typedSeen, remountKeeps: out.remountKeeps, remountText: out.remountText, diffInsBg: out.diffInsBg, diffDelBg: out.diffDelBg, partErr: out.partErr, error: out.error }) })
  } catch { /* the harness may not be listening */ }
</script>
