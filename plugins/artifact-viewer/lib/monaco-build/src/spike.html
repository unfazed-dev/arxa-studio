<!doctype html><meta charset="utf-8"><title>monaco spike</title>
<style>html,body{margin:0;height:100%}#ed{position:absolute;inset:0}#diff{position:absolute;left:-9999px;width:800px;height:300px}#part{position:absolute;inset:0;display:none}#part.on{display:block}</style>
<div id="ed"></div>
<div id="diff"></div>
<div id="part"></div>
<script type="module">
  const RS = 'use std::collections::HashMap;\n\n/// squares 1..=n\nfn squares(n: i32) -> HashMap<i32, i32> {\n    (1..=n).map(|x| (x, x * x)).collect()\n}\n\n// a deliberately long line so word wrap has something to act on: lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor\nfn main() {\n    let m = squares(5);\n    println!("{:?}", m.get(&3));\n}\n'
  const DART = 'void main() {\n  final xs = <int>[1, 2, 3];\n  print(xs.map((x) => x * x).toList());\n}\n'
  const RS2 = RS.replace('squares(5)', 'squares(9)')
  const el = document.getElementById('ed')
  const settle = (ms) => new Promise((r) => setTimeout(r, ms))
  // Published IMMEDIATELY and mutated in place: if a step hangs or throws, the
  // lens still sees how far the page got instead of `__spike is undefined`.
  const out = { step: 'start' }
  window.__spike = out
  window.addEventListener('error', (e) => { out.error = String(e.message) })
  // Which STEP produces the stray rejection? The console shows the stack but
  // not the moment, and the whole point is to know what to stop doing.
  out.rejects = []
  window.addEventListener('unhandledrejection', (e) => {
    out.rejects.push(out.step + '=' + String((e.reason && (e.reason.name || e.reason.message)) ?? e.reason))
  })

  const m = await import('/__arxa/artifacts/vendor/arxa-monaco.js')

  out.step = 'open-rust'
  // 1. open a rust file
  let h = await m.openFile(el, '/spike/main.rs', RS, { onChange: () => { out.changed = true } })
  await settle(2500)
  out.editor = !!h.editor
  out.lines = h.model.getLineCount()
  out.lang = h.model.getLanguageId()
  out.tokens = document.querySelectorAll('.monaco-editor .view-line span').length
  out.langs = m.monaco.languages.getLanguages().length

  out.step = 'switch-dart'
  // 2. switch to a DIFFERENT file — a second language, from a second extension
  h.dispose()
  h = await m.openFile(el, '/spike/main.dart', DART)
  await settle(1200)
  out.lang2 = h.model.getLanguageId()

  out.step = 'reopen-rust'
  // 3. come back to the FIRST path with CHANGED bytes. The overlay used to
  //    stack per open, so createModelReference handed back the first model and
  //    this showed the ORIGINAL text. This is the reopen regression.
  h.dispose()
  h = await m.openFile(el, '/spike/main.rs', RS2, { onChange: () => { out.changed = true } })
  await settle(1200)
  out.reopenLang = h.model.getLanguageId()
  out.reopenFresh = h.model.getValue().includes('squares(9)')
  out.reopenNoStale = !h.model.getValue().includes('squares(5)')

  out.step = 'adapter-edit'
  // 4. the adapter the client drives: getText + replaceRange (what the
  //    prettier format action uses) must keep the model in step.
  const before = h.getText()
  const at = before.indexOf('squares(9)')
  h.replaceRange(at, at + 10, 'squares(7)')
  out.edited = h.getText().includes('squares(7)')
  out.onChangeFired = out.changed === true

  out.step = 'editor-worker'
  // 5. force an EDITOR-WORKER round trip. Nothing in the spike had ever asked
  //    MonacoEnvironment.getWorker for a label, so the label map was written
  //    on faith. Diff computation runs in TextEditorWorker.
  const de = m.monaco.editor.createDiffEditor(document.getElementById('diff'), { automaticLayout: false })
  de.setModel({
    original: m.monaco.editor.createModel(RS, 'rust'),
    modified: m.monaco.editor.createModel(RS2, 'rust'),
  })
  for (let i = 0; i < 60 && !(de.getLineChanges() || []).length; i++) await settle(100)
  out.diffChanges = (de.getLineChanges() || []).length
  out.workerLabels = (self.__arxaWorkerLabels || []).join(',')
  out.workerAsked = (self.__arxaWorkerLabels || []).length > 0

  out.step = 'theme-flip'
  // 6. the theme flip must reach an already-open editor
  const bgOf = () => getComputedStyle(document.querySelector('.monaco-editor')).getPropertyValue('--vscode-editor-background').trim()
  out.bg = bgOf()
  m.setTheme(false)
  await settle(1200)
  out.bgLight = bgOf()
  out.themeFlipped = out.bgLight !== '' && out.bgLight !== out.bg
  m.setTheme(true)
  await settle(800)

  out.step = 'resize'
  // Responsiveness: the pane is user-resizable (drag the divider, resize the
  // window), so the editor must FOLLOW its container, not keep its first size.
  const w0 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  el.style.right = '600px'          // shrink the container
  await settle(1200)
  const w1 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  el.style.right = '0px'            // and back
  await settle(1200)
  const w2 = document.querySelector('.monaco-editor').getBoundingClientRect().width
  out.resizeShrank = w1 < w0 - 50
  out.resizeRestored = Math.abs(w2 - w0) < 5
  out.widths = [Math.round(w0), Math.round(w1), Math.round(w2)].join('/')

  // Narrow-pane SHAPE, not just size. The viewer is a side pane and gets
  // dragged small; the minimap and gutters have to get out of the way and long
  // lines have to wrap rather than run off the side.
  const minimapOn = () => !!document.querySelector('.monaco-editor .minimap') &&
    document.querySelector('.monaco-editor .minimap').getBoundingClientRect().width > 0
  const wraps = () => h.editor.getOption(m.monaco.editor.EditorOption.wrappingInfo).isViewportWrapping
  out.wideMinimap = minimapOn()
  out.wideNoWrap = !wraps()
  el.style.right = (window.innerWidth - 480) + 'px'   // a realistically narrow pane
  await settle(1200)
  out.narrowMinimap = minimapOn()
  out.narrowWraps = wraps()
  el.style.right = (window.innerWidth - 300) + 'px'   // very narrow
  await settle(1200)
  out.tinyLineNumbers = h.editor.getOption(m.monaco.editor.EditorOption.lineNumbers).renderType
  el.style.right = '0px'
  await settle(1200)
  out.restoredMinimap = minimapOn()

  // The user's bug, asserted as geometry: with no stylesheet the editor's
  // lines escape the container and paint at the top-left of the PAGE.
  const box = el.getBoundingClientRect()
  const lines = document.querySelector('.monaco-editor .view-lines')
  const lb = lines ? lines.getBoundingClientRect() : null
  out.contained = !!lb && lb.left >= box.left - 1 && lb.top >= box.top - 1 &&
    lb.right <= box.right + 1 && lb.width > 0
  out.styled = !!lines && getComputedStyle(document.querySelector('.monaco-editor')).position !== 'static'
  // 2c: the monaco language id of every extension the LSP rows claim. A
  // documentSelector matches on the language id, and a mismatch is SILENT —
  // the client starts, the server runs, no document is ever synced and no
  // underline ever appears. `plaintext` here means a dead row.
  out.step = 'language-ids'
  out.ids = {}
  for (const ext of ['ts', 'tsx', 'mts', 'cts', 'js', 'jsx', 'mjs', 'cjs', 'html', 'css', 'scss', 'less', 'json', 'jsonc']) {
    try {
      const mdl = m.monaco.editor.createModel('', undefined, m.monaco.Uri.parse('file:///spike/probe.' + ext))
      out.ids[ext] = mdl.getLanguageId()
      mdl.dispose()
    } catch (e) { out.ids[ext] = 'ERR:' + String(e && e.message || e) }
  }
  // Phase 3 probe: what does the markdown extension actually give us?
  out.step = 'markdown-probe'
  let mdHandle = null
  try {
    h.dispose()   // the resize block left an editor in the container
    mdHandle = await m.openFile(el, '/spike/notes.md', '# Title\n\nsome *text* and a [link](x.md)\n\n```rs\nfn f(){}\n```\n')
    await settle(1500)
    out.mdLang = mdHandle.model.getLanguageId()
    out.mdTokens = document.querySelectorAll('.monaco-editor .view-line span').length
    out.mdColoured = new Set([...document.querySelectorAll('.monaco-editor .view-line span')]
      .map((n) => getComputedStyle(n).color)).size
    // left OPEN on purpose: the final capture then shows a real markdown file
    // with its grammar, instead of a blank page.
  } catch (e) { out.mdErr = String(e && e.message || e) }
  // Did the WEBWORKER EXTENSION HOST actually start? It runs inside an iframe.
  // No iframe means no extension code ever runs — which is exactly how
  // markdown-language-features looked "installed" while doing nothing at all.
  // Give activation (onLanguage:markdown fires from the open above) time to
  // either work or throw; a throw lands in the console and the lens fails it.
  out.step = 'ext-host'
  await settle(3000)
  out.extHostFrames = document.querySelectorAll('iframe').length

  // ---- the EDITOR PART ---------------------------------------------------
  // Everything above drives a bare monaco editor over a model. This drives VS
  // Code: hand it a uri, let it pick the editor. It is the only way a webview
  // (markdown preview) or a custom editor (media-preview's png viewer) can
  // ever open, and it is the thing the plan claimed would cost the whole
  // workbench chrome. attachPart takes ONE part.
  out.step = 'attach-part'
  try {
    // BOTH standalone editors must go first. wrapOpenEditor looks for an
    // existing StandaloneEditor whose model uri matches the resource and, if it
    // finds one, focuses THAT and never touches the editor part — measured: the
    // file landed in standalone group -4 while the part's group 0 stayed empty.
    // The two lanes cannot share a uri, which is the whole reason the code lane
    // has to move off monaco.editor.create.
    h.dispose()
    if (mdHandle) mdHandle.dispose()
    // Let the teardown settle before attaching the part. Disposing a standalone
    // editor cancels its in-flight work, and VS Code signals cancellation by
    // rejecting; attaching and opening in the same tick raced that rejection
    // into an unhandled `Canceled: Canceled` about half the time.
    await settle(500)
    el.style.display = 'none'
    const partEl = document.getElementById('part')
    partEl.className = 'on'
    await m.attachEditorPart(partEl)
    await settle(800)
    // No chrome came with it: the pane must not sprout an activity bar,
    // a sidebar, a panel or a status bar.
    // The other parts get CONSTRUCTED by the layout whether or not they are
    // attached; what matters is whether any of them paints. Measure the box,
    // not the existence of a node.
    out.partChrome = ['activitybar', 'sidebar', 'panel', 'statusbar']
      .filter((k) => [...document.querySelectorAll('.part.' + k)]
        .some((n) => n.getBoundingClientRect().width > 0 && n.getBoundingClientRect().height > 0))
    out.partMounted = partEl.querySelector('.part.editor') !== null
    const pe = partEl.querySelector('.part.editor')
    out.partBox = pe ? Math.round(pe.getBoundingClientRect().width) + 'x' + Math.round(pe.getBoundingClientRect().height) : 'none'

    out.step = 'open-through-vscode'
    try { out.vsPane = String(await m.openEditor('/spike/notes.md')) }
    catch (e) { out.vsOpenErr = String(e && e.message || e) }
    await settle(2500)
    out.vsOpened = document.querySelector('#part .monaco-editor') !== null
    out.vsTabs = document.querySelectorAll('#part .tabs-container .tab').length
    out.vsText = (document.querySelector('#part .monaco-editor .view-lines')?.innerText ?? '').slice(0, 40)
    try { Object.assign(out, await m.editorPartInfo()) } catch (e) { out.infoErr = String(e && e.message || e) }
    const pEl = document.getElementById('part')
    out.partHtml = (pEl.innerHTML || '').length
    // querySelector does not pierce a shadow root, and monaco-vscode-api puts
    // the workbench in one for style isolation. Walk both.
    const roots = [document]
    for (const n of document.querySelectorAll('*')) if (n.shadowRoot) roots.push(n.shadowRoot)
    out.shadowRoots = roots.length - 1
    out.anyEditor = roots.some((r) => r.querySelector('.monaco-editor') !== null)
    out.anyTab = roots.reduce((a, r) => a + r.querySelectorAll('.tab').length, 0)
    out.partClasses = [...pEl.querySelectorAll('*')].slice(0, 14).map((n) => n.className && String(n.className).slice(0, 28)).filter(Boolean).join('|')

    out.step = 'markdown-preview'
    const before = document.querySelectorAll('iframe').length
    await m.runCommand('markdown.showPreview')
    await settle(4000)
    out.previewFrames = document.querySelectorAll('iframe').length - before
    // A webview is an iframe whose document actually rendered the markdown.
    // Counting frames alone would pass on an empty one.
    out.previewTitle = [...document.querySelectorAll('iframe')]
      .map((f) => { try { return f.contentDocument?.body?.innerText ?? '' } catch { return '' } })
      .some((t) => t.includes('Title'))
  } catch (e) { out.partErr = String(e && e.message || e) }
  out.step = 'done'
  // --expect reports one boolean for the whole run, so the only way to SEE
  // which probe failed is to paint the values into the page and read them off
  // the capture. Same technique that found scss/less opening as plaintext.
  const dump = document.createElement('pre')
  dump.style.cssText = 'position:absolute;inset:0;z-index:99999;background:#111;color:#0f0;font:16px/1.5 monospace;padding:16px;margin:0;white-space:pre-wrap'
  dump.textContent = JSON.stringify({
    partMounted: out.partMounted, partBox: out.partBox, partChrome: out.partChrome,
    vsOpened: out.vsOpened, vsTabs: out.vsTabs, vsText: out.vsText, vsOpenErr: out.vsOpenErr,
    vsPane: out.vsPane, editors: out.editors, active: out.active, partHtml: out.partHtml, infoErr: out.infoErr,
    shadowRoots: out.shadowRoots, anyEditor: out.anyEditor, anyTab: out.anyTab,
    paneId: out.paneId, groups: out.groups, parts: out.parts, mainGroups: out.mainGroups, openRes: out.openRes,
    groupActive: out.groupActive, notices: out.notices,
    previewFrames: out.previewFrames, previewTitle: out.previewTitle,
    extHostFrames: out.extHostFrames, partErr: out.partErr, mdErr: out.mdErr, error: out.error,
    rejects: out.rejects,
  }, null, 1)
  if (location.search.includes('dump')) document.body.appendChild(dump)
</script>
