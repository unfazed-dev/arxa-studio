# The disposable local Supabase harness config (task 14 step 2).
#
# Started ONLY by scripts/workspace-provider-supabase-smoke.mjs (and the
# dedicated CI job) from a SCRATCH COPY of this directory — never from the
# checkout and never against the operator's own supabase state. Ports are
# pinned in the 549xx range, away from the supabase defaults (54321…) so a
# running operator stack cannot collide.
project_id = "arxa-workspace-provider"

[api]
enabled = true
port = 54921

[db]
port = 54922

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:54921"

[auth.email]
# the reference email/password UX (Ruling 8): open signup, auto-confirm, so
# the smoke's two harness users come up without an email round-trip
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "1GiB" # the Wire v1 MAX_BLOB_BYTES bound

[realtime]
# off by design: the provider declares realtime absent and degrades to the
# contract's adaptive polling (Ruling 9 / D35) — the badge stays truthful
enabled = false
